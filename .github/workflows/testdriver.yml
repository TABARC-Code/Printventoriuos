name: TestDriver.ai Tests

# This fork has no TD_API_KEY secret, so every push and PR went red for a reason nobody could act on.
# Manual runs only for now. Add the secret in Settings > Secrets and variables > Actions, then put
# the push and pull_request triggers back (they're in the upstream version of this file).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run TestDriver.ai tests
      env:
        TD_API_KEY: ${{ secrets.TD_API_KEY }}
      run: npx vitest run

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30
